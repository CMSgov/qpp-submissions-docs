version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    open-pull-requests-limit: 3
    schedule:
      interval: "daily"
      time: "02:00"
    cooldown:
      default-days: 7
      exclude:
        - "@cmsgov/qpp-scoring-engines"
        - "qpp-measures-data"
        - "@cmsgov/qpp-shared-logger-node"
    allow:
      - dependency-name: "*"
        dependency-type: "production"
    reviewers:
      - "CMSgov/cis-qppa-developers"
    assignees:
      - "nicholas-gates"
